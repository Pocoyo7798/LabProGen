---
id: https://w3id.org/labprogen/action-data-model
name: action-data-model
title: LabProGen Action Data Model
description: >-
    Closed LinkML schema for laboratory elementary actions, support actions,
    and chemical entities. Source of truth: Action Data Model Rules and Definitions.
    The `closed` flags document the intended additional-property policy; the
    installed LinkML runtime does not load that metamodel field, so unknown
    slots are rejected by the project validator.
license: CC-BY 4.0
version: "1.9.0"

prefixes:
  adm: https://w3id.org/labprogen/action-data-model/
  linkml: https://w3id.org/linkml/
  OBI: http://purl.obolibrary.org/obo/OBI_
  CHMO: http://purl.obolibrary.org/obo/CHMO_
  PATO: http://purl.obolibrary.org/obo/PATO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  BFO: http://purl.obolibrary.org/obo/BFO_
  EDAM: http://edamontology.org/
  chemrof: https://w3id.org/chemrof/
  AFE: http://purl.allotrope.org/ontologies/equipment#AFE_
  AFM: http://purl.allotrope.org/ontologies/material#AFM_
  AFP: http://purl.allotrope.org/ontologies/process#AFP_
  AFQ: http://purl.allotrope.org/ontologies/quality#AFQ_
  AFR: http://purl.allotrope.org/ontologies/result#AFR_
  AFRL: http://purl.allotrope.org/ontologies/role#AFRL_
  AFRE: http://purl.allotrope.org/ontologies/realizable#AFRE_

default_prefix: adm
default_range: string

imports:
  - linkml:types

classes:

  LabProcedure:
    tree_root: true
    closed: true
    description: A completed laboratory procedure as an ordered list of actions.
    slots:
      - protocol_name
      - laboratory_actions
    slot_usage:
      laboratory_actions:
        required: true

  Action:
    abstract: true
    closed: false
    description: >-
      An action is a unit element in a procedure and is a concretization of an
      action specification.
    class_uri: AFRE:0000001
    slots:
      - type
      - id

  # ---------------------------------------------------------------------------
  # Action categories (abstract grouping classes)
  # ---------------------------------------------------------------------------

  OneOffAction:
    is_a: Action
    abstract: true
    description: >-
      Basic laboratory action whose modification of the chemical system
      persists after the action ends.

  PersistentAction:
    is_a: Action
    abstract: true
    description: >-
      Basic laboratory action whose modification only exists while the action
      is maintained.

  IndirectPersistentAction:
    is_a: PersistentAction
    abstract: true
    description: >-
      Persistent action that does not modify the chemical system directly,
      changing how other laboratory actions modify the system.

  DirectPersistentAction:
    is_a: PersistentAction
    abstract: true
    description: Persistent action that modifies the chemical system directly.

  # ---------------------------------------------------------------------------
  # One-off actions
  # ---------------------------------------------------------------------------

  Add:
    is_a: OneOffAction
    closed: true
    description: Addition of a chemical entity to a container.
    comments:
      - >-
        AFP:0003743 - Adding is loading material into a container where it is
        combined with existing material. [Allotrope]
    class_uri: AFP:0003743
    slots:
      - chemical
      - duration
      - add_type
      - open_flame
    slot_usage:
      chemical:
        required: true
        description: Chemical entity added to the system.
      duration:
        required: true
      add_type:
        required: true
      open_flame:
        required: true

  Grind:
    is_a: OneOffAction
    closed: true
    description: >-
      Process that reduces the particle size of a sample by attrition
      (friction), impact or cutting.
    comments:
      - >-
        CHMO:0001652 - A material processing that reduces the particle size of
        a sample by attrition (friction), impact or cutting. [CHMO]
    class_uri: CHMO:0001652
    slots:
      - duration

  Separate:
    is_a: OneOffAction
    closed: true
    description: >-
      Action that results in the separation of two or more components
      according to some property.
    comments:
      - >-
        CHMO:0000999 - A method that results in the separation of two or more
        components according to some property. [CHMO]
      - >-
        AFP:0000422 - A branching process that isolates flows into distinct
        component flows. The separated components are distinct from the flow
        before separation, as well as each other. [NIST]
      - >-
        OBI:0600014 - A material processing in which components of an input
        material become segregated in space. [OBI]
    class_uri: OBI:0600014
    exact_mappings:
      - AFP:0000422
      - CHMO:0000999
    slots:
      - phase_to_keep
      - method
      - duration
    slot_usage:
      phase_to_keep:
        required: true
      method:
        required: true

  # Separation methods: used inside Separate.method, each with its own slots.

  SeparationMethod:
    abstract: true
    closed: false
    description: Method used to carry out a separation.
    slots:
      - type

  Filtration:
    is_a: SeparationMethod
    closed: true
    description: Separation of solids from a fluid by passing the fluid through a filter.
    class_uri: CHMO:0001640
    exact_mappings:
      - AFP:0001530
    slots:
      - filter_pore_size

  Centrifugation:
    is_a: SeparationMethod
    closed: true
    description: Separation of components by rotation at high speed.
    class_uri: OBI:0302886
    slots:
      - speed
    slot_usage:
      speed:
        description: Rotation speed of the centrifuge rotor, e.g. 4000 rpm.

  Sieving:
    is_a: SeparationMethod
    closed: true
    description: Screening of solid particles by size.
    aliases:
      - Sieve
    slots:
      - size_range
    slot_usage:
      size_range:
        required: true

  Decantation:
    is_a: SeparationMethod
    closed: true
    description: Separation by pouring off the liquid above a settled solid or denser liquid.

  Evaporation:
    is_a: SeparationMethod
    closed: true
    description: Separation by vaporizing the volatile components.
    class_uri: CHMO:0001574

  NoAction:
    is_a: OneOffAction
    closed: true
    description: Absence of an externally imposed intervention.
    aliases:
      - NoModification
    slots:
      - duration
    slot_usage:
      duration:
        required: true

  ChangeContainer:
    is_a: OneOffAction
    closed: true
    description: >-
      Modification of the mixture recipient that can be used to restrict the
      location of material entities over time.
    aliases:
      - ChangeRecipient
    class_uri: OBI:0000967
    slots:
      - recipient
      - material
      - volume
      - container_state
    slot_usage:
      recipient:
        required: true
      material:
        required: true
      volume:
        required: true

  CollectSubProduct:
    is_a: OneOffAction
    closed: true
    description: Indication that another product will not follow the main path.
    slots:
      - phase_to_keep
    slot_usage:
      phase_to_keep:
        required: true

  # ---------------------------------------------------------------------------
  # Indirect persistent actions
  # ---------------------------------------------------------------------------

  Repeat:
    is_a: IndirectPersistentAction
    closed: true
    description: >-
      Action specification that indicates repetition of laboratory actions.
    comments:
      - >-
        AFRL:0000521 - A repeated action role is a contextual role of an action
        specification that specifies the repeated action in a repeated action
        specification. [Allotrope]
    class_uri: AFRL:0000521
    slots:
      - amount
    slot_usage:
      amount:
        required: true
        description: Number of repetitions.

  # ---------------------------------------------------------------------------
  # Direct persistent actions
  # ---------------------------------------------------------------------------

  ChangePressure:
    is_a: DirectPersistentAction
    closed: true
    description: >-
      Modification of the amount of force exerted per unit area by the system.
    comments:
      - >-
        AFQ:0000337 - A pressure configuration is a device configuration of a
        pressure controlling or monitoring device, that controls or monitors
        the target pressure at the site of some system component. [Allotrope]
      - >-
        AFR:0002731 - A pressure setting is a setting that specifies some
        pressure configuration of a pressure controlling or monitoring device,
        that controls or monitors the target pressure at the site of some
        system component. [Allotrope]
    class_uri: AFQ:0000337
    exact_mappings:
      - AFR:0002731
    slots:
      - pressure
    slot_usage:
      pressure:
        required: true

  ChangeTemperature:
    is_a: DirectPersistentAction
    closed: true
    description: >-
      Modification of the physical quality of the thermal energy of a system.
    comments:
      - >-
        AFR:0001255 - A temperature setting is a setting that specifies some
        temperature configuration of a temperature controlling or monitoring
        device, that controls or monitors the target temperature at the site of
        some system component. [Allotrope]
      - >-
        AFQ:0000203 - A temperature configuration is a device configuration of
        a temperature controlling or monitoring device, that controls or
        monitors the target temperature at the site of some system component.
        [Allotrope]
    class_uri: AFR:0001255
    exact_mappings:
      - AFQ:0000203
    slots:
      - temperature
      - process
      - ramp
      - power
    slot_usage:
      temperature:
        required: true
      process:
        required: true

  ChangeAgitation:
    is_a: DirectPersistentAction
    closed: true
    description: Change the motion of the system.
    comments:
      - >-
        AFE:0001265 - An agitator is a device or mechanism to put something
        into motion. [Allotrope]
    class_uri: AFE:0001265
    slots:
      - agitation_type
      - speed
    slot_usage:
      agitation_type:
        required: true

  ContinuousAddition:
    is_a: DirectPersistentAction
    closed: true
    description: Addition of a chemical entity to a container over time.
    slots:
      - chemical
      - continuous_add_type
      - amount
      - flow_rate
      - entry_point
    slot_usage:
      chemical:
        required: true
        description: Chemical entity or entities added to the system over time.
      continuous_add_type:
        required: true
      amount:
        required: false
        description: Number of additions if the addition type is Intermittent.
      flow_rate:
        required: true

  ChemicalEntity:
    closed: false
    description: Chemical entity is a physical entity of interest in chemistry formed by atoms.
    comments:
      - >-
        CHEBI:24431 - A chemical entity is a physical entity of interest in
        chemistry including molecular entities, parts thereof, and chemical
        substances. [ChEBI]
      - >-
        BFO:0000040 - An independent continuant that is spatially extended
        whose identity is independent of that of other entities and can be
        maintained through time. [BFO]
      - >-
        AFM:0000275 - A material entity that occupies space and possesses a
        rest mass. [Allotrope]
    class_uri: CHEBI:24431
    exact_mappings:
      - BFO:0000040
      - AFM:0000275
    slots:
      - type
      - quantity
      - preparation_procedure
      - entity_id
      - entity_producer
      - cas_number

  Substance:
    is_a: ChemicalEntity
    closed: true
    description: Group of chemical entities all of the same kind.
    comments:
      - >-
        CHEBI:60003 - A pure substance is a chemical substance composed of
        multiple molecules, which are all of the same kind. [ChEBI]
    class_uri: CHEBI:60003
    slots:
      - name
      - entity_purity
    slot_usage:
      name:
        required: true

  MixtureConstituent:
    is_a: ChemicalEntity
    closed: true
    description: Class to store information about Substances that live in mixtures.
    slots:
      - chemical
      - concentration
    slot_usage:
      chemical:
        required: true
        inlined: true
        inlined_as_list: false
        multivalued: false
        description: Chemical entity.
      concentration:
        required: true

  Mixture:
    is_a: ChemicalEntity
    closed: true
    description: Group of two or more Substances.
    comments:
      - >-
        CHEBI:60004 - A mixture is a chemical substance composed of multiple
        molecules, at least two of which are of a different kind. [ChEBI]
    class_uri: CHEBI:60004
    slots:
      - name
      - chemical_list
    slot_usage:
      name:
        required: true
        description: Mixture name.
      chemical_list:
        required: true

  Molecule:
    is_a: Substance
    closed: true
    description: Polyatomic chemical entity that is electrically neutral.
    comments:
      - >-
        CHEBI:25367 - A molecule is a polyatomic molecular entity that is an
        electrically neutral entity consisting of more than one atom. [ChEBI]
    class_uri: CHEBI:25367
    slots:
      - formula
      - smile
      - inchi
    slot_usage:
      formula:
        required: true
      smile:
        required: true

  # Polymers: the same descriptors apply to an individual polymer (Substance)
  # and to a polymer mixture such as a blend or composite (Mixture).

  PolymerProperties:
    mixin: true
    description: Descriptors shared by polymers, whether a substance or a mixture.
    slots:
      - bigsmiles
      - repeat_units
      - number_average_molar_mass
      - weight_average_molar_mass
      - dispersity
      - melting_temperature
      - glass_transition_temperature

  CopolymerProperties:
    is_a: PolymerProperties
    mixin: true
    description: Additional descriptors of copolymers.
    slots:
      - copolymer_type

  Polymer:
    is_a: Substance
    mixins:
      - PolymerProperties
    closed: true
    description: >-
      Material composed of macromolecules that may differ in composition,
      chain length and degree of branching.
    comments:
      - >-
        CHEBI:60027 - A polymer is a mixture, which is composed of
        macromolecules of different kinds and which may be differentiated by
        composition, length, degree of branching etc. [ChEBI]
      - >-
        CHEBI:33839 - A macromolecule is a molecule of high relative molecular
        mass, the structure of which essentially comprises the multiple
        repetition of units derived, actually or conceptually, from molecules
        of low relative molecular mass. [ChEBI]
    aliases:
      - Polymers
    class_uri: CHEBI:60027
    related_mappings:
      - CHEBI:33839
    slot_usage:
      name:
        required: false

  Copolymer:
    is_a: Polymer
    mixins:
      - CopolymerProperties
    closed: true
    description: Polymer derived from more than one species of monomer.
    slot_usage:
      repeat_units:
        minimum_cardinality: 2

  PolymerMixture:
    is_a: Mixture
    mixins:
      - PolymerProperties
    closed: true
    description: >-
      Mixture characterized as a polymer as a whole, e.g. a polymer blend or
      composite.
    slot_usage:
      name:
        required: false
      chemical_list:
        required: false

  CopolymerMixture:
    is_a: PolymerMixture
    mixins:
      - CopolymerProperties
    closed: true
    description: Polymer mixture characterized as a copolymer as a whole.
    slot_usage:
      repeat_units:
        minimum_cardinality: 2

  RepeatUnit:
    closed: true
    description: >-
      Constitutional repeating unit of a polymer chain. A structural fragment,
      not a material, so it is not a ChemicalEntity.
    slots:
      - name
      - formula
      - smile
      - proportion
    slot_usage:
      formula:
        required: true
        description: Formula of the repeating unit.
      smile:
        description: >-
          SMILES of the repeating unit with attachment points marked by *,
          e.g. *CC(*)c1ccccc1 for polystyrene.
      name:
        description: Name of the repeating unit or its monomer.
      proportion:
        description: >-
          Proportion of the repeating unit in the polymer, with its basis,
          e.g. 50 mol%, 30 wt%.

  # Bioproducts: an isolated product (Substance) or a product still in a
  # mixture such as a crude extract or broth (Mixture).

  BioProductProperties:
    mixin: true
    description: Descriptors shared by bioproducts, whether a substance or a mixture.
    slots:
      - origin
      - production_phase
      - location
      - temperature_stability
      - light_sensitivity
      - oxidation_sensitivity
      - toxicity_to_producer

  BioProducts:
    is_a: Substance
    mixins:
      - BioProductProperties
    closed: true
    description: Entities created by biological compounds like metabolites.
    slot_usage:
      name:
        required: false
        description: Name of the product.

  BioProductsMixture:
    is_a: Mixture
    mixins:
      - BioProductProperties
    closed: true
    description: >-
      Mixture characterized as a bioproduct as a whole, e.g. a crude extract
      or fermentation broth.
    slot_usage:
      name:
        required: false
        description: Name of the product.
      chemical_list:
        required: false

  Medium:
    is_a: Mixture
    closed: true
    description: Biological media purchased from a company or obtained from an external lab.
    slots:
      - function
      - state
      - purity
      - sterility
      - solubility
      - temperature_stability
      - light_sensitivity
      - oxidation_sensitivity
    slot_usage:
      name:
        required: false
      chemical_list:
        required: false
      quantity:
        description: Mass, volume, or moles.

  # Porous materials: an individual material (Substance) or a physical
  # mixture or supported material characterized as a whole (Mixture).

  PorousMaterialProperties:
    mixin: true
    description: >-
      Characterization descriptors of a porous material, whether a substance
      or a mixture.
    slots:
      - crystallinity
      - n2_adsorption_bet_area
      - n2_adsorption_micropore_area
      - n2_adsorption_mesopore_area
      - n2_adsorption_total_volume
      - n2_adsorption_micropore_volume
      - n2_mesopore_volume
      - py_b_150
      - py_b_450
      - py_l_150
      - py_l_450

  ZeoliteProperties:
    is_a: PorousMaterialProperties
    mixin: true
    description: Additional descriptors of zeolites.
    slots:
      - si_al_ratio
      - frameworks

  PorousMaterial:
    is_a: Substance
    mixins:
      - PorousMaterialProperties
    closed: true
    description: Solid material containing pores, characterized as an individual material.
    aliases:
      - HeterogeneousCatalysts
    slots:
      - formula
    slot_usage:
      name:
        required: false
      formula:
        description: Chemical formula of the substance.

  Zeolite:
    is_a: PorousMaterial
    mixins:
      - ZeoliteProperties
    closed: true
    description: >-
      Crystalline microporous aluminosilicate (or related) material built from
      one or more framework types.

  PorousMaterialMixture:
    is_a: Mixture
    mixins:
      - PorousMaterialProperties
    closed: true
    description: >-
      Physical mixture or supported material characterized as a whole as a
      porous material, e.g. 5 wt% Pt/Al2O3.
    aliases:
      - HeterogeneousCatalystsMixture
    slot_usage:
      name:
        required: false
      chemical_list:
        required: false

  ZeoliteMixture:
    is_a: PorousMaterialMixture
    mixins:
      - ZeoliteProperties
    closed: true
    description: >-
      Mixture characterized as a zeolite as a whole, e.g. a zeolite with a
      binder or a physical mixture of zeolites.

  Framework:
    closed: true
    description: >-
      Framework type present in a zeolite. A single-framework zeolite has one
      entry; an intergrowth or mixture of frameworks has one entry per
      framework, each with its proportion.
    slots:
      - framework_code
      - name
      - proportion
    slot_usage:
      framework_code:
        required: true
      name:
        description: Name of the framework or material type, e.g. ZSM-5.
      proportion:
        description: >-
          Proportion of this framework in the material, with its basis,
          e.g. 70 wt%. Omit for a single framework.

  # ---------------------------------------------------------------------------
  # Cells
  # ---------------------------------------------------------------------------

  Cell:
    is_a: Substance
    closed: true
    description: >-
      Biological cells used in a procedure, such as a microbial culture, a cell
      line or a primary cell isolate, described as a sample.
    slots:
      # 1. Biological identity and origin
      - biological_category
      - species_name
      - taxon_id
      - strain_designation
      - culture_collection_accession
      - cell_type
      - sample_origin
      - tissue_or_organ
      - batch_lot
      - biological_composition
      - genetic_modification_status
      - genetic_modifications
      - identity_authentication
      # 2. Cell sample characteristics
      - sample_presentation
      - preservation_state
      - preservation_protocol
      - optical_density
      - viability
      - growth_phase
      - culture_age
      - culture_age_reference
      - passage_number
      - passage_counting_convention
      - confluence
      - differentiation_status
      - contamination_status
      # 3. Physicochemical descriptors of the cell preparation
      - suspension_medium
      - extracellular_ph
      - osmolality
      - conductivity
      - supplements
      - cryoprotectants
      - dissolved_oxygen
    slot_usage:
      name:
        required: false
      entity_id:
        description: Catalogue reference of the cells.
      entity_producer:
        description: Supplier, culture collection or laboratory that provided the cells.
      preparation_procedure:
        description: Link to the protocol used to obtain the material.

  # ---------------------------------------------------------------------------
  # Helper classes (not materials)
  # ---------------------------------------------------------------------------

  GeneticModification:
    closed: true
    description: One genetic alteration carried by the cells.
    slots:
      - modification_description
      - construct
      - sequence_references

slots:

  # ---------------------------------------------------------------------------
  # Action slots
  # ---------------------------------------------------------------------------

  type:
    range: string
    designates_type: true
    description: Concrete class name used as the LinkML type designator.

  id:
    range: string
    description: Identifier of the action.

  protocol_name:
    range: string

  laboratory_actions:
    range: Action
    multivalued: true
    inlined_as_list: true

  chemical:
    range: ChemicalEntity
    multivalued: true
    inlined_as_list: true
    description: Chemical entity or entities used by an action.

  duration:
    range: string
    description: Clock time elapsed.

  add_type:
    range: AdditionTypeEnum
    description: Type of addition.

  open_flame:
    range: OpenFlameEnum
    description: Whether an open flame is present during the addition (True or False).

  phase_to_keep:
    range: PhaseToKeepEnum
    description: The phase or fraction that will continue to be changed.

  method:
    range: SeparationMethod
    inlined: true
    description: Separation method, with its own descriptors.

  filter_pore_size:
    range: string
    description: Pore size of the filter, e.g. 0.45 µm.

  size_range:
    range: string
    description: Size range of the particles.

  pressure:
    range: string
    description: Amount of force exerted per unit area by the system.
    comments:
      - >-
        AFR:0001918 - Pressure is a quality quantification facet that
        quantifies the amount of force exerted per unit area. [PATO]
    slot_uri: AFR:0001918

  temperature:
    range: string
    description: The physical quality of the thermal energy of a system.
    comments:
      - PATO:0000146 - A physical quality of the thermal energy of a system. [PATO]
    slot_uri: PATO:0000146

  process:
    range: HeatingProcessEnum
    description: Type of temperature modification.

  ramp:
    range: string
    description: Quantifies the change in temperature over time in the system.
    comments:
      - >-
        AFR:0002393 - A temperature rate is a quality quantification facet that
        quantifies the change in temperature over time in some material.
        [Allotrope]
    slot_uri: AFR:0002393

  power:
    range: string

  agitation_type:
    range: AgitationTypeEnum
    description: Stirring type.

  speed:
    range: string
    description: >-
      Angular velocity of the rotating, agitating component responsible for
      the agitation.
    slot_uri: AFR:0002101

  recipient:
    range: RecipientTypeEnum
    description: Type of recipient.
    slot_uri: OBI:0000967

  material:
    range: VesselMaterialEnum
    description: Material of the recipient.

  volume:
    range: string
    description: Volume of the recipient.
    slot_uri: AFR:0001843

  container_state:
    range: ContainerStateEnum
    description: Closure state of the recipient.

  amount:
    range: string
    description: Number of repetitions or intermittent additions.

  continuous_add_type:
    range: ContinuousAdditionTypeEnum
    description: Addition type.

  flow_rate:
    range: string
    description: Quantifies the motion in time.
    comments:
      - >-
        PATO:0001574 - A physical quality inhering in a bearer by virtue of the
        bearer's motion characteristic. [PATO]
      - >-
        AFR:0001881 - Flow rate is a quality quantification facet that
        quantifies the motion of material through a surface per time.
        [Allotrope]
    slot_uri: PATO:0001574
    exact_mappings:
      - AFR:0001881

  entry_point:
    range: EntryPointEnum
    description: Where the entrance occurs.

  # ---------------------------------------------------------------------------
  # Chemical entity slots
  # ---------------------------------------------------------------------------

  preparation_procedure:
    range: string
    description: Entity formed by a group of actions organized in order of execution.
    comments:
      - >-
        AFRE:0000002 - A procedure is a plan containing multiple activities
        that are intended to be executed in an order following a procedure
        specification. [Allotrope]
    slot_uri: AFRE:0000002

  quantity:
    range: string
    description: Amount added. e.g. g, ml, L, uL, mg

  entity_id:
    range: string
    description: ID from the entity (commercial or internal).

  entity_producer:
    range: string
    description: Supplier; institution that created the entity.

  entity_purity:
    range: string
    description: Proportion of the bearer against undesired components.
    comments:
      - >-
        AFQ:0000209 - Purity is a composition quality inhering in a bearer by
        virtue of the bearer lacking undesired components. [Allotrope]
    slot_uri: AFQ:0000209

  cas_number:
    range: string
    description: >-
      CAS registry number of a chemical compound; a unique numerical identifier
      of chemicals in the scientific literature, as assigned by the Chemical
      Abstracts Service.
    slot_uri: EDAM:data_1002

  name:
    range: string

  formula:
    range: string
    description: Identifies each element present in the molecule.
    comments:
      - >-
        AFR:0001952 - A molecular formula is a molecular entity facet which
        identifies each constituent element by its chemical symbol and
        indicates the number of atoms of each element found in each discrete
        molecular entity of that compound. [CHEMINF]
    slot_uri: AFR:0001952

  smile:
    range: string
    description: >-
      A SMILES molecular structure is a molecular structure specified in
      Simplified Molecular Input Line Entry System (SMILES) line notation.
    slot_uri: AFR:0002295
    exact_mappings:
      - chemrof:smiles_string

  inchi:
    range: string
    description: >-
      An InChI molecular structure is a molecular structure specified in IUPAC
      International Chemical Identifier (InChI) line notation.
    slot_uri: AFR:0002296
    exact_mappings:
      - chemrof:inchi_string

  bigsmiles:
    range: string
    description: BigSMILES representation; for polymers BigSMILES should be used instead of normal SMILES.

  concentration:
    range: string
    description: >-
      Proportion of the bearer relative to other mixed substances,
      e.g. m/m, vol/vol, M, g/L.
    comments:
      - >-
        AFR:0002036 - A concentration (datum) is a quantification facet that
        quantifies a quality inhering in a substance by virtue of the amount of
        the bearer there is mixed with another substance. [Allotrope]
    slot_uri: AFR:0002036

  repeat_units:
    range: RepeatUnit
    multivalued: true
    inlined_as_list: true
    description: Repeating units that make up the polymer chain.

  proportion:
    range: string
    description: >-
      Proportion of a unit within the whole, with its basis,
      e.g. 50 mol%, 30 wt%.

  si_al_ratio:
    range: string
    description: Si/Al molar ratio of the zeolite, e.g. 15.

  frameworks:
    range: Framework
    multivalued: true
    inlined_as_list: true
    description: Framework type or types present in the zeolite.

  framework_code:
    range: string
    description: >-
      Three-letter framework type code assigned by the International Zeolite
      Association (IZA), e.g. MFI, FAU, CHA.

  copolymer_type:
    range: CopolymerTypeEnum
    description: Arrangement of the repeating units along the chain.

  number_average_molar_mass:
    range: string
    description: Number-average molar mass (Mn), e.g. 25000 g/mol.

  weight_average_molar_mass:
    range: string
    description: Weight-average molar mass (Mw), e.g. 40000 g/mol.

  dispersity:
    range: string
    description: Dispersity (Mw/Mn) of the molar mass distribution.

  melting_temperature:
    range: string
    description: >-
      Fusion (melting) temperature (Tm). Not applicable to fully amorphous
      polymers.

  glass_transition_temperature:
    range: string
    description: Glass transition temperature (Tg).

  chemical_list:
    range: MixtureConstituent
    multivalued: true
    inlined_as_list: true
    description: List of MixtureConstituent objects used.

  origin:
    range: BioProductOriginEnum
    description: Metabolic origin of the product.

  production_phase:
    range: ProductionPhaseEnum
    description: Relation between product formation and cell growth.

  location:
    range: BioProductLocationEnum
    description: Location of the product relative to the producing cell.

  temperature_stability:
    range: TemperatureStabilityEnum
    description: Stability of the entity at different temperatures.

  light_sensitivity:
    range: YesNoEnum
    description: Whether the entity is sensitive to light (yes or no).

  oxidation_sensitivity:
    range: OxidationSensitivityEnum
    description: Sensitivity of the entity to air or oxygen.

  toxicity_to_producer:
    range: ToxicityToProducerEnum
    description: Effect of the product on the organism that produces it.

  function:
    range: MediumFunctionEnum
    description: Function to the cell culture.

  state:
    range: PhysicalStateEnum
    description: Physical state of the medium.

  purity:
    range: PurityGradeEnum
    description: Purity grade of the medium.

  sterility:
    range: SterilityEnum
    description: Sterility condition of the medium.

  solubility:
    range: string
    description: Solubility of the medium, e.g. water solubility, pH-dependent solubility.

  crystallinity:
    range: string
    description: Percentage of crystal phase, obtained through XRD data.

  n2_adsorption_bet_area:
    range: string
    description: Surface area measured using the BET method with N2 adsorption results (m2/g).

  n2_adsorption_micropore_area:
    range: string
    description: Micropore area measured using the t-plot method with N2 adsorption results (m2/g).

  n2_adsorption_mesopore_area:
    range: string
    description: Mesopore area measured combining the BET method and t-plot method with N2 adsorption results (m2/g).

  n2_adsorption_total_volume:
    range: string
    description: Total volume of N2 adsorbed during the test.

  n2_adsorption_micropore_volume:
    range: string
    description: Micropore volume of N2 adsorbed obtained through the t-plot method.

  n2_mesopore_volume:
    range: string
    description: Mesopore volume of N2 adsorbed obtained combining the t-plot method results and the total adsorbed volume.

  py_b_150:
    range: string
    description: Amount of adsorbed pyridine in Brønsted acid sites at 150 °C.

  py_b_450:
    range: string
    description: Amount of adsorbed pyridine in Brønsted acid sites at 450 °C.

  py_l_150:
    range: string
    description: Amount of adsorbed pyridine in Lewis acid sites at 150 °C.

  py_l_450:
    range: string
    description: Amount of adsorbed pyridine in Lewis acid sites at 450 °C.

  # ---------------------------------------------------------------------------
  # Cell slots
  # ---------------------------------------------------------------------------

  # 1. Biological identity and origin

  biological_category:
    range: BiologicalCategoryEnum
    description: Broad biological category of the cells.

  species_name:
    range: string
    description: Scientific name of the species.

  taxon_id:
    range: string
    description: Taxonomic identifier, where available, e.g. NCBITaxon:562.

  strain_designation:
    range: string
    description: Full designation of the strain, isolate or cell line.

  culture_collection_accession:
    range: string
    description: >-
      Culture collection identifier or accession number, where applicable,
      e.g. ATCC 25922.

  cell_type:
    range: string
    description: >-
      Cell type, using a controlled term where available, e.g. fibroblast,
      hepatocyte or epithelial cell.

  sample_origin:
    range: SampleOriginEnum
    description: Where the cell sample came from.

  tissue_or_organ:
    range: string
    description: Tissue or organ of origin, when the cells were isolated from one.

  batch_lot:
    range: string
    description: Batch or lot number of the material.

  biological_composition:
    range: BiologicalCompositionEnum
    description: Whether the sample is a single culture, a defined co-culture or an undefined community.

  genetic_modification_status:
    range: GeneticModificationStatusEnum
    description: Whether the cells carry genetic modifications.

  genetic_modifications:
    range: GeneticModification
    multivalued: true
    inlined_as_list: true
    description: Alterations, constructs and sequence references, if the cells are modified.

  identity_authentication:
    range: IdentityAuthenticationStatusEnum
    description: Whether the identity of the cells has been authenticated.

  # 2. Cell sample characteristics

  sample_presentation:
    range: SamplePresentationEnum
    description: Physical form in which the cells are presented.

  preservation_state:
    range: PreservationStateEnum
    description: Treatment or preservation state of the cells.

  preservation_protocol:
    range: string
    description: Link to the protocol used for treatment or preservation.

  optical_density:
    range: string
    description: Optical density (dimensionless), with wavelength, e.g. OD600; optical path length or correction and dilution where relevant.

  viability:
    range: string
    description: Percentage of cells classified as viable (%).

  growth_phase:
    range: GrowthPhaseEnum
    description: Growth phase of the culture.

  culture_age:
    range: string
    description: Time elapsed since a defined event (h or days); see culture_age_reference.

  culture_age_reference:
    range: CultureAgeReferenceEnum
    description: Event from which the culture age is counted.

  passage_number:
    range: integer
    description: Number of passages. Particularly applicable to cell cultures.

  passage_counting_convention:
    range: string
    description: Convention used to count passages.

  confluence:
    range: string
    description: Percentage of surface area occupied (%). Applicable to adherent cultures.

  differentiation_status:
    range: DifferentiationStatusEnum
    description: Differentiation status of the cells.

  contamination_status:
    range: ContaminationStatusEnum
    description: Contamination status of the cell sample.

  # 3. Physicochemical descriptors of the cell preparation

  suspension_medium:
    range: ChemicalEntity
    inlined: true
    description: >-
      Suspension medium or buffer, e.g. a Medium or Mixture with its name,
      commercial reference or composition.

  extracellular_ph:
    range: string
    description: Extracellular pH (dimensionless), with the temperature at which it was measured.

  osmolality:
    range: string
    description: Medium osmolality (mOsm/kg).

  conductivity:
    range: string
    description: Medium conductivity (mS/cm), with the temperature.

  supplements:
    range: MixtureConstituent
    multivalued: true
    inlined_as_list: true
    description: >-
      Substrates, salts and supplements, each with its identity and
      concentration (mmol/L, g/L, or % with an explicit basis).

  cryoprotectants:
    range: MixtureConstituent
    multivalued: true
    inlined_as_list: true
    description: Cryoprotectants, each with its identity and concentration (% v/v, % w/v or mol/L).

  dissolved_oxygen:
    range: string
    description: Dissolved oxygen (mg/L, µmol/L or % saturation), with temperature and saturation reference where applicable.

  # Genetic modification slots

  modification_description:
    range: string
    description: Description of the genetic alteration.

  construct:
    range: string
    description: Genetic construct used, e.g. plasmid name.

  sequence_references:
    range: string
    multivalued: true
    description: Sequence references for the modification, e.g. GenBank accessions.

enums:

  # ---------------------------------------------------------------------------
  # Action enums
  # ---------------------------------------------------------------------------

  AdditionTypeEnum:
    permissible_values:
      Normal:
        description: Addition of the full amount at once.
      Dropwise:
        description: Slow addition of a liquid drop by drop.
        meaning: CHMO:0001544
      Diffusion:
        description: Addition by slow diffusion, e.g. vapour or layering diffusion.

  OpenFlameEnum:
    permissible_values:
      "True": {}
      "False": {}

  PhaseToKeepEnum:
    permissible_values:
      Liquid: {}
      Solid: {}
      Gas: {}
      Aqueous: {}
      Organic: {}
      Undersize:
        description: Sieving fraction that passed through the sieve (or the finest sieve).
      "Intermediate fraction":
        description: Sieving fraction retained between two sieves.
      Oversize:
        description: Sieving fraction retained on the sieve (or the coarsest sieve).

  HeatingProcessEnum:
    permissible_values:
      Plate-heater:
        meaning: AFE:0002267
      Microwave:
        meaning: CHMO:0002444
      Ice-bath:
        meaning: OBI:0003689
      Water-bath:
        meaning: OBI:0400155
      Atmospheric:
        meaning: AFR:0002157

  AgitationTypeEnum:
    permissible_values:
      Manual: {}
      Magnetic:
        meaning: AFP:0000039
      Mechanical: {}
      Rotative: {}
      "None": {}

  RecipientTypeEnum:
    permissible_values:
      Beaker: {}
      Flask: {}
      Autoclave:
        meaning: CHMO:0002166

  VesselMaterialEnum:
    permissible_values:
      Glass: {}
      Plastic: {}
      Ceramic: {}

  ContainerStateEnum:
    permissible_values:
      sealed: {}
      closed: {}
      open: {}

  ContinuousAdditionTypeEnum:
    permissible_values:
      Continuous:
        meaning: PATO:0000689
      Intermittent:
        meaning: PATO:0000690

  EntryPointEnum:
    permissible_values:
      Top: {}
      Bottom: {}

  # ---------------------------------------------------------------------------
  # Chemical entity enums
  # ---------------------------------------------------------------------------

  CopolymerTypeEnum:
    permissible_values:
      random:
        description: Repeating units distributed randomly (statistically) along the chain.
      alternating:
        description: Repeating units alternate regularly along the chain.
      block:
        description: Long sequences (blocks) of each repeating unit.
      graft:
        description: Side chains of one unit grafted onto a backbone of another.

  BioProductOriginEnum:
    permissible_values:
      "primary metabolite": {}
      "secondary metabolite": {}
      "recombinant protein": {}

  ProductionPhaseEnum:
    permissible_values:
      "associated to growth": {}
      "not associated to growth": {}
      mixed: {}

  BioProductLocationEnum:
    permissible_values:
      intracellular: {}
      extracellular: {}
      "membrane bound": {}

  TemperatureStabilityEnum:
    permissible_values:
      thermostable:
        description: Stable at high temperatures (>60 °C).
      "heat stable":
        description: Stable during autoclaving (121 °C, 20 min).
      "moderately stable":
        description: Stable at room temperature but not at autoclave temperatures.
      "heat labile":
        description: Degrades above 40-50 °C.
      "very heat labile":
        description: Degrades above room temperature.
      "cryogenic storage required":
        description: Degrades even when frozen at -20 °C.

  YesNoEnum:
    permissible_values:
      "yes": {}
      "no": {}

  OxidationSensitivityEnum:
    permissible_values:
      "oxidation stable":
        description: Not affected by air/oxygen.
      "oxidation sensitive":
        description: Degrades slowly in air.
      "highly oxidation sensitive":
        description: Degrades rapidly in air.
      "oxygen reactive":
        description: Reacts immediately with oxygen.

  ToxicityToProducerEnum:
    permissible_values:
      inhibitory: {}
      toxic: {}
      neutral: {}

  MediumFunctionEnum:
    permissible_values:
      "Carbon Source": {}
      "Nitrogen Source": {}
      Mineral: {}
      Vitamin: {}
      "Growth Factor": {}
      Inducer: {}
      Precursor: {}

  PhysicalStateEnum:
    permissible_values:
      solid:
        description: Powder, crystalline, or granular form.
      liquid:
        description: Aqueous or organic liquid.
      "semi-solid":
        description: Gel, paste, or viscous suspension.
      lyophilized:
        description: Freeze-dried powder (common for proteins, sera).
      frozen:
        description: Stored below 0 °C (common for sera, certain vitamins).

  PurityGradeEnum:
    permissible_values:
      technical: {}
      reagent: {}
      analytical: {}
      "molecular biology": {}
      "cell culture grade": {}

  SterilityEnum:
    permissible_values:
      sterile: {}
      "non-sterile": {}
      "filter-sterilized": {}
      autoclavable: {}

  # ---------------------------------------------------------------------------
  # Cell enums
  # ---------------------------------------------------------------------------

  BiologicalCategoryEnum:
    permissible_values:
      bacterium: {}
      archaea: {}
      yeast: {}
      "filamentous fungus": {}
      microalga: {}
      "animal cell": {}
      "plant cell": {}
      other: {}

  SampleOriginEnum:
    permissible_values:
      "culture collection": {}
      supplier: {}
      laboratory: {}
      "environmental isolation": {}
      "tissue or organ": {}

  BiologicalCompositionEnum:
    permissible_values:
      "single strain or cell line culture": {}
      "defined co-culture": {}
      "undefined community": {}

  GeneticModificationStatusEnum:
    permissible_values:
      "no known modification": {}
      "genetically modified": {}
      unknown: {}

  IdentityAuthenticationStatusEnum:
    permissible_values:
      confirmed: {}
      "not assessed": {}
      inconclusive: {}

  SamplePresentationEnum:
    permissible_values:
      "cell suspension": {}
      pellet: {}
      monolayer: {}
      "aggregate or spheroid": {}
      biofilm: {}
      "immobilized cells": {}

  PreservationStateEnum:
    permissible_values:
      fresh: {}
      refrigerated: {}
      frozen: {}
      cryopreserved: {}
      lyophilized: {}
      fixed: {}
      inactivated: {}

  GrowthPhaseEnum:
    permissible_values:
      lag: {}
      exponential: {}
      stationary: {}
      decline: {}
      "not determined": {}

  CultureAgeReferenceEnum:
    permissible_values:
      inoculation: {}
      subculture: {}
      thawing: {}

  DifferentiationStatusEnum:
    permissible_values:
      undifferentiated: {}
      "partially differentiated": {}
      differentiated: {}
      "not assessed": {}

  ContaminationStatusEnum:
    permissible_values:
      "not detected": {}
      detected: {}
      "not tested": {}
